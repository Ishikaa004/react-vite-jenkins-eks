apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-vite-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-vite-app
  template:
    metadata:
      labels:
        app: react-vite-app
    spec:
      containers:
      - name: react-vite-app
        image: ishikaa24/react-vite-jenkins-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: react-vite-app-svc
spec:
  type: NodePort
  selector:
    app: react-vite-app
  ports:
    - port: 80
      targetPort: 80
